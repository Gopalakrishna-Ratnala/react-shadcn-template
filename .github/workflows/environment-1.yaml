name: Build and Deploy to environment 1

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and deploy to Env 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          
      - name: Install dependencies
        run: npm i

      - name: Build
        run: npm run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync build output to S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET_NAME_1 }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_1 }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "Environment: 1"
          echo "S3 bucket: ${{ vars.S3_BUCKET_NAME_1 }}"
          echo "CloudFront distribution: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_1 }}"